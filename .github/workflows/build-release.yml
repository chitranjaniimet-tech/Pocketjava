name: Build PocketJava Release

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  issues: write

concurrency:
  group: pocketjava-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent PocketJava debug signing key
        shell: bash
        run: |
          mkdir -p .ci
          base64 --decode .ci/pocketjava-debug.keystore.b64 > .ci/pocketjava-debug.jks
          chmod 600 .ci/pocketjava-debug.jks
          keytool -list \
            -keystore .ci/pocketjava-debug.jks \
            -storepass pocketjava-debug-2026 \
            -alias pocketjava-debug >/dev/null

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;35.0.0" || true

      - name: Build installable APK
        id: build
        shell: bash
        run: |
          set +e
          CI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon --stacktrace --warning-mode all \
            -PciVersionCode="$CI_VERSION_CODE" \
            -PpocketJavaDebugKeystore="$GITHUB_WORKSPACE/.ci/pocketjava-debug.jks" \
            :app:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "version_code=$CI_VERSION_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish failure diagnostics to one GitHub issue
        if: steps.build.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## PocketJava CI failure diagnostics"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_NUMBER\`"
            echo
            echo "### Last 220 lines of Gradle output"
            echo '```text'
            tail -n 220 build.log || true
            echo '```'
          } > failure.md

          issue_number=$(gh issue list --state open --search 'PocketJava CI failure diagnostics in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file failure.md
          else
            gh issue create --title "PocketJava CI failure diagnostics" --body-file failure.md
          fi

      - name: Fail workflow after diagnostics are saved
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Prepare release APK
        if: steps.build.outputs.status == '0'
        run: cp app/build/outputs/apk/debug/app-debug.apk PocketJava.apk

      - name: Publish APK directly to GitHub Release
        if: steps.build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PocketJava.apk \
            --target "$GITHUB_SHA" \
            --title "PocketJava 0.2.0 • Build ${GITHUB_RUN_NUMBER}" \
            --notes "Upgradeable PocketJava debug APK. All CI debug builds use the same persistent signing identity and an increasing versionCode, so future APKs can install over this build without uninstalling. Published directly to Releases; no GitHub Actions artifact storage is used."
