name: Build PocketJava Release

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  issues: write

concurrency:
  group: pocketjava-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare ECJ Android 16 compiler platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/android-platform
          mkdir -p .ci/android-platform app/src/main/assets/compiler
          cp "$ANDROID_HOME/platforms/android-36/android.jar" .ci/android-platform/android.jar
          pushd .ci/android-platform >/dev/null
          unzip -q android.jar
          rm -f android.jar resources.arsc
          rm -rf res assets
          jar cfM "$GITHUB_WORKSPACE/app/src/main/assets/compiler/android-36.jar" .
          popd >/dev/null
          test -s app/src/main/assets/compiler/android-36.jar
          echo "Compiler platform size: $(du -h app/src/main/assets/compiler/android-36.jar | cut -f1)"

      - name: Java compiler regression test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/compiler-smoke
          mkdir -p .ci/compiler-smoke/classes

          curl -fsSL \
            "https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.18.0/ecj-3.18.0.jar" \
            -o .ci/compiler-smoke/ecj.jar

          cat > .ci/compiler-smoke/CompilerStressTest.java <<'JAVA'
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Arrays;
          import java.util.List;
          import java.util.concurrent.CompletableFuture;
          import java.util.stream.Collectors;

          public class CompilerStressTest {
              public static void main(String[] args) throws Exception {
                  double number = 12.3;
                  if (number < 0.0) {
                      throw new AssertionError("negative branch");
                  } else if (number > 0.0) {
                      System.out.println(number + " is a positive number.");
                  } else {
                      throw new AssertionError("zero branch");
                  }

                  List<String> filtered = Arrays.asList("apple", "banana", "cherry", "date")
                          .stream()
                          .filter(s -> s.startsWith("b") || s.startsWith("c"))
                          .map(String::toUpperCase)
                          .collect(Collectors.toList());
                  if (filtered.size() != 2 || !filtered.contains("BANANA")) {
                      throw new AssertionError("streams/lambdas");
                  }

                  Path p = Path.of("compiler_test_temp.txt");
                  Files.writeString(p, "Java Compiler Verification");
                  if (!"Java Compiler Verification".equals(Files.readString(p))) {
                      throw new AssertionError("nio");
                  }
                  Files.deleteIfExists(p);

                  CompletableFuture<Integer> future = CompletableFuture.supplyAsync(() -> {
                      int sum = 0;
                      for (int i = 1; i <= 100; i++) sum += i;
                      return sum;
                  });
                  if (future.get() != 5050) throw new AssertionError("future");
              }
          }
          JAVA

          java -jar .ci/compiler-smoke/ecj.jar \
            -proc:none \
            -source 11 \
            -target 11 \
            -nowarn \
            -d .ci/compiler-smoke/classes \
            -classpath app/src/main/assets/compiler/android-36.jar \
            .ci/compiler-smoke/CompilerStressTest.java

          java -cp .ci/compiler-smoke/classes CompilerStressTest

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent PocketJava debug signing key
        shell: bash
        run: |
          mkdir -p .ci
          base64 --decode .ci/pocketjava-debug.keystore.b64 > .ci/pocketjava-debug.jks
          chmod 600 .ci/pocketjava-debug.jks
          keytool -list \
            -keystore .ci/pocketjava-debug.jks \
            -storepass pocketjava-debug-2026 \
            -alias pocketjava-debug >/dev/null

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;35.0.0" || true
          test -s app/src/main/assets/compiler/android-36.jar

      - name: Build installable APK
        id: build
        shell: bash
        run: |
          set +e
          CI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon --stacktrace --warning-mode all \
            -PciVersionCode="$CI_VERSION_CODE" \
            -PpocketJavaDebugKeystore="$GITHUB_WORKSPACE/.ci/pocketjava-debug.jks" \
            :app:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "version_code=$CI_VERSION_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish failure diagnostics to one GitHub issue
        if: steps.build.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## PocketJava CI failure diagnostics"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_NUMBER\`"
            echo
            echo "### Last 220 lines of Gradle output"
            echo '```text'
            tail -n 220 build.log || true
            echo '```'
          } > failure.md

          issue_number=$(gh issue list --state open --search 'PocketJava CI failure diagnostics in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file failure.md
          else
            gh issue create --title "PocketJava CI failure diagnostics" --body-file failure.md
          fi

      - name: Fail workflow after diagnostics are saved
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Prepare release APK
        if: steps.build.outputs.status == '0'
        run: cp app/build/outputs/apk/debug/app-debug.apk PocketJava.apk

      - name: Publish APK directly to GitHub Release
        if: steps.build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PocketJava.apk \
            --target "$GITHUB_SHA" \
            --title "PocketJava 0.3.1 • Build ${GITHUB_RUN_NUMBER}" \
            --notes "PocketJava 0.3.1 pins ECJ to Android-compatible 3.18.0 to avoid the javax.lang.model.SourceVersion crash on Android while retaining Java 11 language support. The release is gated by positive/negative branching, Streams/Lambdas, NIO.2 and CompletableFuture compiler regression tests. Published directly to Releases; no GitHub Actions artifact storage is used."
