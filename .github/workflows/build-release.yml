name: Build PocketForge Release

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  issues: write

concurrency:
  group: pocketforge-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare ECJ Android 16 compiler platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/android-platform .ci/compiler-shim-src .ci/compiler-shim-classes
          mkdir -p .ci/android-platform .ci/compiler-shim-src/java/lang/invoke \
            .ci/compiler-shim-classes app/src/main/assets/compiler
          cp "$ANDROID_HOME/platforms/android-36/android.jar" .ci/android-platform/android.jar
          pushd .ci/android-platform >/dev/null
          unzip -q android.jar
          rm -f android.jar resources.arsc
          rm -rf res assets
          jar cfM "$GITHUB_WORKSPACE/app/src/main/assets/compiler/android-36.jar" .
          popd >/dev/null

          # android.jar intentionally omits this desktop-Java bootstrap class.
          # ECJ still resolves it while type-checking java.util.function.Function,
          # although D8 later desugars lambdas into ordinary Android bytecode.
          cat > .ci/compiler-shim-src/java/lang/invoke/LambdaMetafactory.java <<'JAVA'
          package java.lang.invoke;

          /** Compile-time placeholder; never loaded on Android at runtime. */
          public final class LambdaMetafactory {
              private LambdaMetafactory() {}
          }
          JAVA
          javac --patch-module java.base=.ci/compiler-shim-src \
            -d .ci/compiler-shim-classes \
            .ci/compiler-shim-src/java/lang/invoke/LambdaMetafactory.java
          jar uf app/src/main/assets/compiler/android-36.jar \
            -C .ci/compiler-shim-classes java/lang/invoke/LambdaMetafactory.class
          test -s app/src/main/assets/compiler/android-36.jar
          echo "Compiler platform size: $(du -h app/src/main/assets/compiler/android-36.jar | cut -f1)"

      - name: Java compiler regression test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/compiler-smoke
          mkdir -p .ci/compiler-smoke/classes

          curl -fsSL \
            "https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.18.0/ecj-3.18.0.jar" \
            -o .ci/compiler-smoke/ecj.jar

          cat > .ci/compiler-smoke/CompilerStressTest.java <<'JAVA'
          public class CompilerStressTest {
              interface RecursiveFunction<T> extends java.util.function.Function<RecursiveFunction<T>, T> {}

              interface Mapper<T, R> {
                  R map(T value);
              }

              public static void main(String[] args) {
                  double number = 12.3;
                  if (number < 0.0) {
                      throw new AssertionError("negative branch");
                  } else if (number > 0.0) {
                      System.out.println(number + " is a positive number.");
                  } else {
                      throw new AssertionError("zero branch");
                  }

                  Mapper<Integer, Integer> square = value -> value * value;
                  int result = square.map(12);
                  if (result != 144) throw new AssertionError("lambda");

                  RecursiveFunction<String> recursive = value -> "works";
                  if (!"works".equals(recursive.apply(recursive))) {
                      throw new AssertionError("function lambda");
                  }
              }
          }
          JAVA

          java -jar .ci/compiler-smoke/ecj.jar \
            -proc:none \
            -source 11 \
            -target 11 \
            -nowarn \
            -d .ci/compiler-smoke/classes \
            -classpath app/src/main/assets/compiler/android-36.jar \
            .ci/compiler-smoke/CompilerStressTest.java

          # This is deliberately a compile-only gate.  The compiler's platform
          # library is Android's android.jar; attempting to execute classes
          # compiled against it on the runner's desktop JRE produces false
          # failures and prevented the fixed APK from being built.
          test -f .ci/compiler-smoke/classes/CompilerStressTest.class

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent PocketForge debug signing key
        shell: bash
        run: |
          mkdir -p .ci
          base64 --decode .ci/pocketforge-debug.keystore.b64 > .ci/pocketforge-debug.jks
          chmod 600 .ci/pocketforge-debug.jks
          keytool -list \
            -keystore .ci/pocketforge-debug.jks \
            -storepass pocketforge-debug-2026 \
            -alias pocketforge-debug >/dev/null

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;35.0.0" || true
          test -s app/src/main/assets/compiler/android-36.jar

      - name: Build installable APK
        shell: bash
        run: |
          set -o pipefail
          CI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon --stacktrace --warning-mode all \
            -PciVersionCode="$CI_VERSION_CODE" \
            -PpocketForgeDebugKeystore="$GITHUB_WORKSPACE/.ci/pocketforge-debug.jks" \
            :app:assembleDebug 2>&1 | tee build.log

      - name: Verify upgrade identity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          certificate_digest=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          expected_certificate_digest=$(keytool -exportcert \
            -keystore .ci/pocketforge-debug.jks \
            -storepass pocketforge-debug-2026 \
            -alias pocketforge-debug \
            | openssl dgst -sha256 \
            | awk '{print $2}')
          test "$certificate_digest" = "$expected_certificate_digest"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.moneyclaritytech.pocketforge.debug'"

          echo "Upgrade identity verified: package ID, signing certificate and monotonic CI version code are stable."

      - name: Publish failure diagnostics to one GitHub issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## PocketForge CI failure diagnostics"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_NUMBER\`"
            echo
            echo "### Last 220 lines of Gradle output"
            echo '```text'
            tail -n 220 build.log || true
            echo '```'
          } > failure.md

          issue_number=$(gh issue list --state open --search 'PocketForge CI failure diagnostics in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file failure.md
          else
            gh issue create --title "PocketForge CI failure diagnostics" --body-file failure.md
          fi

      - name: Fail workflow after diagnostics are saved
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Prepare release APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk PocketForge.apk

      - name: Publish APK directly to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PocketForge.apk \
            --target "$GITHUB_SHA" \
            --title "PocketForge 0.1.0 • Build ${GITHUB_RUN_NUMBER}" \
            --notes "PocketForge 0.1.0 uses safe system-bar insets and keyboard resize behaviour, and makes the terminal command action explicit. Published directly to Releases; no GitHub Actions artifact storage is used."
